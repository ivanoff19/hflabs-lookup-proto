<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFLabs — LookUP Prototype</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0e7d8f;--accent-h:#0a6b7a;--accent-bg:#f0f8f9;--accent-border:#c8e6ea;
  --text:#08080a;--text-m:#36393e;--text-f:#8f9092;
  --border:#e5e5e6;--border2:#ebebec;
  --surf:#fff;--surf2:#f8f8f8;--surf3:#f3f3f4;
  --red:#d93649;--red-bg:#fff2f3;--amber:#d97706;--amber-bg:#fffbeb;
  --green:#16a34a;--green-bg:#f0fdf4;
  --r:6px;--rs:4px;--shadow:0 4px 20px rgba(0,0,0,.1);--shadow-md:0 8px 32px rgba(0,0,0,.14);
}
html,body{height:100%;background:#eef0f2;color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
html.dark-theme{--accent:#3bb7c9;--accent-h:#3fcbde;--accent-bg:#1a3237;--accent-border:#1e4d55;--text:#e8eaed;--text-m:#9aa0a6;--text-f:#6b7280;--border:#2d2d2f;--border2:#38383a;--surf:#1e1e20;--surf2:#262628;--surf3:#2e2e30;--red:#f87171;--red-bg:#3b1a1a;--amber:#fbbf24;--amber-bg:#332b10;--green:#4ade80;--green-bg:#143020;--shadow:0 4px 20px rgba(0,0,0,.4);--shadow-md:0 8px 32px rgba(0,0,0,.5)}
html.dark-theme body{background:#131314}
html.dark-theme .content-area{background:#131314}

/* ── Outer layout ── */
.outer{display:flex;height:100vh;overflow:hidden}

/* ── State sidebar ── */
.state-bar{width:200px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 8px;gap:4px;overflow-y:auto}
.state-bar-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-f);padding:4px 8px 8px}
.state-bar-sep{height:1px;background:var(--border);margin:6px 0}
.state-bar-group{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-f);padding:6px 8px 2px;opacity:.7}
.sb-btn{background:transparent;border:1px solid transparent;color:var(--text-m);padding:7px 10px;border-radius:var(--rs);cursor:pointer;font-family:inherit;font-size:12px;text-align:left;transition:all .15s;line-height:1.35;width:100%}
.sb-btn:hover{background:var(--surf2);color:var(--text);border-color:var(--border2)}
.sb-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.sb-btn strong{display:block;font-weight:600;font-size:11.5px}
.sb-btn span{font-size:10.5px;opacity:.65;margin-top:1px;display:block}

/* ── Main frame ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ── App nav ── */
.app-nav{background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;height:44px;padding:0 20px;flex-shrink:0;z-index:50}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--text);margin-right:20px;text-decoration:none}
.nav-logo-icon{width:26px;height:26px;flex-shrink:0}
.nav-tabs{display:flex;height:44px;align-items:stretch;flex:1}
.nav-tab{padding:0 16px;display:flex;align-items:center;font-size:13px;color:var(--text-m);cursor:pointer;border-bottom:2px solid transparent;position:relative;top:1px;white-space:nowrap;transition:color .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.nav-user{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-m);cursor:pointer;padding:4px 8px;border-radius:var(--rs);transition:background .15s}
.nav-user:hover{background:var(--surf2)}

/* ── Content area ── */
.content-area{flex:1;overflow:auto;background:#eef0f2;padding:20px}
.sprav-card{background:var(--surf);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* ── справочник header ── */
.sprav-header{padding:12px 16px 0;border-bottom:1px solid var(--border)}
.sprav-breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-m);margin-bottom:10px}
.bc-icon{width:16px;height:16px;color:var(--text-f);flex-shrink:0}
.sprav-tabs-row{display:flex;align-items:center}
.sprav-tab{padding:0 12px;height:36px;display:flex;align-items:center;font-size:12.5px;color:var(--text-m);cursor:pointer;border-bottom:2px solid transparent;position:relative;top:1px;transition:color .15s;white-space:nowrap}
.sprav-tab:hover{color:var(--text)}
.sprav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.sprav-tab-actions{margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:10px}

/* ── Meta row ── */
.sprav-meta{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surf2);font-size:11.5px;color:var(--text-f)}
.meta-author{color:var(--text-m);font-weight:500}
.meta-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-work{background:#e0f2fe;color:#0369a1}
.badge-approve{background:#fef9c3;color:#854d0e}

/* ── Search row ── */
.sprav-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border2)}
.search-box{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--rs);padding:5px 10px;background:var(--surf);width:240px}
.search-box input{border:none;outline:none;font-family:inherit;font-size:12px;color:var(--text);background:transparent;width:100%}
.search-box input::placeholder{color:var(--text-f)}
.filter-badge{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surf);font-size:12px;color:var(--text-m);cursor:pointer;transition:all .15s}
.filter-badge:hover{border-color:var(--accent);color:var(--accent)}
.filter-badge.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.filter-count{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;min-width:16px;text-align:center}

/* ── Table ── */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surf2);border-bottom:1px solid var(--border);padding:8px 12px;font-size:12px;font-weight:600;color:var(--text-m);text-align:left;white-space:nowrap;position:sticky;top:0;z-index:10}
th.th-sort{cursor:pointer;user-select:none}
th.th-sort:hover{color:var(--text)}
.th-inner{display:flex;align-items:center;gap:4px}
tbody tr{border-bottom:1px solid var(--border2);transition:background .1s}
tbody tr:hover{background:var(--surf2)}
tbody tr.row-active{background:var(--accent-bg)}
td{padding:8px 12px;font-size:13px;color:var(--text);vertical-align:middle}
td.td-muted{color:var(--text-m)}

/* ── LookUP header ── */
.th-lookup{cursor:pointer;user-select:none}
.th-lookup:hover .link-ico{color:var(--accent)}
.th-lookup.th-open .link-ico{color:var(--accent)}
.th-lookup-inner{display:flex;align-items:center;gap:5px}
.link-ico{color:#9ca3af;flex-shrink:0;transition:color .15s}
.link-ico-active{color:var(--accent)}

/* ── LookUP cell ── */
.lookup-cell{display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .1s}
.lookup-cell:hover{background:var(--accent-bg)}
.lookup-cell.lc-open{background:var(--accent-bg)}
.lookup-val{color:var(--accent);font-weight:500}

/* ── Global popup (fixed, never clipped) ── */
#gPopup{
  position:fixed;z-index:800;display:none;
  background:var(--surf);border:1px solid var(--border2);
  border-radius:8px;box-shadow:var(--shadow-md);
  animation:fadeUp .12s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Tooltip inner ── */
.popup-inner{padding:12px 14px}
.tt-title{font-size:11px;font-weight:600;color:var(--text-f);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tt-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tt-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);padding:4px 8px;font-size:12px;color:var(--text-m);font-weight:500;cursor:pointer;transition:background .1s}
.tt-chip:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tt-chip-sep{font-size:11px;color:var(--text-f)}
.tt-nav{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;cursor:pointer;border-top:1px solid var(--border2);padding-top:8px;margin-top:2px}
.tt-nav:hover{text-decoration:underline}
/* Peek */
.peek-row{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid var(--border2);align-items:baseline}
.peek-row:last-of-type{border-bottom:none}
.peek-label{font-size:11.5px;color:var(--text-f);min-width:100px;flex-shrink:0}
.peek-val{font-size:12.5px;color:var(--text);font-weight:500}
/* Picker */
.lp-search{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border2)}
.lp-search input{border:none;outline:none;font-family:inherit;font-size:13px;color:var(--text);background:transparent;width:100%;min-width:0}
.lp-scroll{overflow-y:auto;max-height:240px}
.lp-table{width:100%;border-collapse:collapse}
.lp-table thead th{background:var(--surf2);padding:6px 12px;font-size:11px;font-weight:600;color:var(--text-f);text-align:left;white-space:nowrap;border-bottom:1px solid var(--border2)}
.lp-table thead th.lp-active{color:var(--accent)}
.lp-table tbody tr{border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s}
.lp-table tbody tr:hover{background:var(--surf2)}
.lp-table tbody tr.lp-sel{background:var(--accent-bg)}
.lp-table td{padding:7px 12px;font-size:12.5px;color:var(--text)}
.lp-table .td-link-cell{color:var(--accent);font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap}
.lp-table td.td-num{color:var(--text-m)}
.lp-foot{padding:8px 12px;border-top:1px solid var(--border2);display:flex;align-items:center;background:var(--surf2);font-size:11px;color:var(--text-f);gap:4px}
/* Sprav picker */
.sp-header{padding:10px 14px;border-bottom:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--text)}
.sp-search{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border2)}
.sp-search input{border:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--text);background:transparent;width:100%;min-width:0}
.sp-list{max-height:220px;overflow-y:auto;padding:6px 0}
.sp-group{display:flex;align-items:center;gap:6px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--text-f);cursor:pointer}
.sp-group:hover{color:var(--text)}
.sp-item{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 28px;font-size:12.5px;color:var(--text-m);cursor:pointer;transition:background .1s}
.sp-item:hover{background:var(--surf2);color:var(--text)}
.sp-empty{padding:24px;text-align:center;color:var(--text-f);font-size:12px}
/* Attr picker */
.ap-back{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .15s}
.ap-back:hover{background:var(--surf2)}
.ap-sub{font-size:11px;color:var(--text-f);padding:6px 14px 8px;border-bottom:1px solid var(--border2)}
.ap-list{max-height:220px;overflow-y:auto;padding:4px 0}
.ap-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:var(--text-m);cursor:pointer;transition:background .1s}
.ap-item:hover{background:var(--surf2);color:var(--text)}
.ap-item.ap-sel{background:var(--accent-bg);color:var(--accent);font-weight:500}
.ap-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ap-item.ap-sel .ap-check{background:var(--accent);border-color:var(--accent)}
.ap-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:#e0f2fe;color:#0369a1;margin-left:auto;font-weight:600}

/* ── Settings ── */
.settings-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.settings-bc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-m);flex:1}
.settings-title{font-size:13px;font-weight:700;color:var(--text)}
.settings-actions{display:flex;align-items:center;gap:8px}
.settings-section{padding:14px 16px 6px;font-size:11.5px;font-weight:700;color:var(--text-m);border-top:1px solid var(--border2)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:13px;color:var(--text-m)}
.toggle{width:32px;height:18px;background:#cbd5e1;border-radius:20px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:16px}

/* ── Attr restrictions ── */
.attr-table{width:100%;border-collapse:collapse}
.attr-table th{padding:7px 12px;font-size:11px;font-weight:600;color:var(--text-f);text-align:left;border-bottom:1px solid var(--border);background:var(--surf2)}
.attr-table td{padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--border2);vertical-align:middle}
.attr-table tbody tr:hover{background:var(--surf2)}
.attr-controls{display:flex;align-items:center;gap:2px}
.attr-ico-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;color:var(--text-f);transition:all .15s;border:none;background:transparent;padding:0}
.attr-ico-btn:hover{background:var(--surf2);color:var(--text-m)}
.select-sm{border:1px solid var(--border);border-radius:var(--rs);padding:4px 24px 4px 8px;font-family:inherit;font-size:12px;color:var(--text-m);background:var(--surf);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 7px center;min-width:120px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--r);border:1px solid var(--accent-border);background:var(--accent-bg);color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1}
.btn:hover{background:var(--surf3);border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-m)}
.btn-ghost:hover{background:var(--surf2);border-color:var(--border2);color:var(--text)}
.btn-icon{padding:5px 8px;color:var(--text-f)}
.btn-icon:hover{color:var(--red);border-color:#fca5a5;background:#fff2f2}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:700;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--surf);border-radius:12px;box-shadow:var(--shadow-md);width:480px;overflow:hidden;animation:scaleIn .15s ease}
.modal-header{padding:20px 20px 12px;display:flex;align-items:flex-start;gap:12px}
.modal-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--red-bg)}
.modal-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-m)}
.modal-body{padding:0 20px 16px}
.modal-dep-list{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-top:12px}
.modal-dep-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--text-m)}
.modal-dep-count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:2px 7px;border-radius:10px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border2);display:flex;justify-content:flex-end;gap:8px;background:var(--surf2)}

/* ── Upload ── */
.upload-card{max-width:680px;margin:0 auto;background:var(--surf);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.upload-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.upload-title{font-size:15px;font-weight:700;color:var(--text)}
.upload-sub{font-size:12.5px;color:var(--text-m);margin-top:2px}
.upload-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.err-box{margin:16px 20px;background:var(--red-bg);border:1px solid #fca5a5;border-radius:var(--r);padding:12px 14px}
.err-box-title{font-size:12.5px;font-weight:600;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.err-box-desc{font-size:12px;color:#7f1d1d;margin-bottom:10px}
.err-table{width:100%;border-collapse:collapse}
.err-table th{padding:6px 10px;font-size:11px;font-weight:600;color:var(--text-f);text-align:left;border-bottom:1px solid var(--border)}
.err-table td{padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--border2)}
.err-table td.ev{color:var(--red);font-weight:500}
.warn-box{margin:0 20px 16px;background:var(--amber-bg);border:1px solid #fcd34d;border-radius:var(--r);padding:10px 14px;font-size:12px;color:#78350f;display:flex;align-items:flex-start;gap:8px}
.ok-box{margin:16px 20px;background:var(--green-bg);border:1px solid #86efac;border-radius:var(--r);padding:12px 14px}
.ok-box-title{font-size:12.5px;font-weight:600;color:var(--green);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.upload-footer{padding:12px 20px;border-top:1px solid var(--border2);background:var(--surf2);display:flex;justify-content:flex-end;gap:8px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:#15803d;color:white;padding:10px 16px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-md);z-index:900;animation:toastIn .2s ease;pointer-events:none}

/* ── Source badge ── */
.src-badge{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

/* ── Hint bar ── */
.hint-bar{margin-top:10px;padding:8px 12px;background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;font-size:12px;color:#78350f;display:flex;gap:8px;align-items:flex-start}

.add-link{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;cursor:pointer;padding:8px 16px;display:flex;align-items:center;gap:5px}
.add-link:hover{opacity:.7}
svg{display:block}
</style>
</head>
<body>
<div class="outer">

<!-- Sidebar -->
<aside class="state-bar">
  <div class="state-bar-title">LookUP — сценарии</div>

  <div class="state-bar-group">Просмотр</div>
  <button class="sb-btn active" onclick="setState(0)">
    <strong>Приёмник: таблица</strong>
    <span>Колонка с LookUP-иконкой</span>
  </button>
  <button class="sb-btn" onclick="setState(1)">
    <strong>Tooltip: связь</strong>
    <span>Клик на заголовке 🔗</span>
  </button>
  <button class="sb-btn" onclick="setState(2)">

const ico = (id, sz=16) => `<svg width="${sz}" height="${sz}" style="flex-shrink:0"><use href="#i-${id}"/></svg>`;

// ─── GLOBAL POPUP ────────────────────────────────────────────
let activeAnchor = null;

function showPopup(html, anchorEl, opts={}) {
  const p = document.getElementById('gPopup');
  p.innerHTML = html;
  p.style.cssText = `
    position:fixed;z-index:800;display:block;
    background:var(--surf);border:1px solid var(--border2);
    border-radius:8px;box-shadow:var(--shadow-md);
    animation:fadeUp .12s ease;
    min-width:${opts.width||240}px;
    max-width:${opts.maxWidth||520}px;
    visibility:hidden;
  `;
  activeAnchor = anchorEl;

  // Mark anchor as open
  document.querySelectorAll('.th-open, .lc-open').forEach(el => el.classList.remove('th-open','lc-open'));
  if (anchorEl) anchorEl.classList.add(anchorEl.classList.contains('lookup-cell') ? 'lc-open' : 'th-open');

  requestAnimationFrame(() => {
    const r = anchorEl ? anchorEl.getBoundingClientRect() : {left:100, bottom:100, top:100, right:100};
    const pw = p.offsetWidth, ph = p.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = r.left;
    let top = r.bottom + 4;
    if (left + pw > vw - 8) left = Math.max(8, vw - pw - 8);
    if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 4);
    p.style.left = left + 'px';
    p.style.top = top + 'px';
    p.style.visibility = 'visible';
  });
}

function hidePopup() {
  const p = document.getElementById('gPopup');
  p.style.display = 'none';
  document.querySelectorAll('.th-open, .lc-open').forEach(el => el.classList.remove('th-open','lc-open'));
  activeAnchor = null;
}

// Close popup on outside click
document.addEventListener('click', e => {
  const p = document.getElementById('gPopup');
  if (p.style.display === 'block' && !p.contains(e.target) && e.target !== activeAnchor && !activeAnchor?.contains(e.target)) {
    hidePopup();
  }
});

// ─── POPUP BUILDERS ──────────────────────────────────────────
function buildHeaderTooltip() {
  return `<div class="popup-inner">
    <div class="tt-title">Связь со справочником</div>
    <div class="tt-chips">
      <span class="tt-chip">${ico('doc',14)} Регионы</span>

    </div>
    <div class="tt-nav">${ico('right',13)} Перейти к справочнику «Регионы»</div>
  </div>`;
}

function buildCellTooltip(rowIdx) {
  const r = BRANCHES[rowIdx];
  const src = REGIONS.find(x => x.name === r.region) || { name:r.region, code:'—', okrug:'—', pop:'—' };
  return `<div class="popup-inner" style="min-width:260px">
    <div class="tt-title" style="display:flex;align-items:center;gap:5px;margin-bottom:10px">
      ${ico('doc',13)} Регионы — «${src.name}»
    </div>
    <div class="peek-row"><span class="peek-label">Название</span><span class="peek-val">${src.name}</span></div>
    <div class="peek-row"><span class="peek-label">Код</span><span class="peek-val">${src.code}</span></div>
    <div class="peek-row"><span class="peek-label">Федер. округ</span><span class="peek-val">${src.okrug}</span></div>
    <div class="peek-row"><span class="peek-label">Население</span><span class="peek-val">${src.pop}</span></div>
    <div class="tt-nav" style="margin-top:8px">${ico('right',13)} Открыть запись в «Регионах»</div>
  </div>`;
}

function buildLookupPicker(selectedName='Москва') {
  const rows = REGIONS.map(r => `<tr class="${r.name===selectedName?'lp-sel':''}">
    <td><div class="td-link-cell">${ico('link',12)} ${r.name}</div></td>
    <td class="td-num">${r.code}</td>
    <td class="td-num">${r.okrug}</td>
    <td class="td-num">${r.pop}</td>
  </tr>`).join('');
  return `
    <div class="lp-search">${ico('search',14)}<input type="text" placeholder="Поиск" onclick="event.stopPropagation()"></div>
    <div class="lp-scroll">
      <table class="lp-table">
        <thead><tr>
          <th class="lp-active"><div class="th-inner">Название ${ico('sort',10)}</div></th>
          <th>Код</th><th>Федер. округ</th><th>Население</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="lp-foot">${ico('info',12)} Только уникальные и обязательные поля</div>
  `;
}

function buildSpravPicker(step=1) {
  if (step === 1) {
    const list = Object.entries(SPRAVORGS).map(([g, items]) => `
      <div class="sp-group">${ico('chevd',12)} ${g}</div>
      ${items.map(i => `<div class="sp-item" onclick="event.stopPropagation();setState(5)">${ico('doc',14)} ${i}</div>`).join('')}
    `).join('');
    return `
      <div class="sp-header">Выберите справочник для сопоставления</div>
      <div class="sp-search">${ico('search',13)}<input type="text" placeholder="Поиск" onclick="event.stopPropagation()"></div>
      <div class="sp-list">${list}</div>
    `;
  } else {
    const items = REGION_ATTRS.map(a => `
      <div class="ap-item ${a.id==='name'?'ap-sel':''}" onclick="event.stopPropagation()">
        <div class="ap-check">${a.id==='name'?`<svg width="10" height="10" style="color:white"><use href="#i-check"/></svg>`:''}</div>
        <span>${a.label}</span>
        ${a.unique?`<span class="ap-tag">уникальный</span>`:''}
      </div>
    `).join('');
    return `
      <div class="ap-back" onclick="event.stopPropagation();setState(4)">${ico('left',14)} <span style="font-size:12.5px;font-weight:600">Регионы</span></div>
      <div class="ap-sub">Выберите атрибут для сопоставления<br><span style="font-size:10.5px">(только уникальные и обязательные поля)</span></div>
      <div class="ap-list">${items}</div>
    `;
  }
}

// ─── INTERACTIONS ────────────────────────────────────────────
function attachInteractions(stateNum) {
  // LookUP column header click
  const thLookup = document.querySelector('.th-lookup');
  if (thLookup) {
    thLookup.addEventListener('click', e => {
      e.stopPropagation();
      if (document.getElementById('gPopup').style.display === 'block' && activeAnchor === thLookup) {
        hidePopup(); return;
      }
      if (stateNum === 4 || stateNum === 5) {
        const step = stateNum === 5 ? 2 : 1;
        showPopup(buildSpravPicker(step), thLookup, {width:300});
      } else {
        showPopup(buildHeaderTooltip(), thLookup, {width:260});
      }
    });
  }

  // LookUP cells click
  document.querySelectorAll('.lookup-cell').forEach((cell, idx) => {
    cell.addEventListener('click', e => {
      e.stopPropagation();
      if (document.getElementById('gPopup').style.display === 'block' && activeAnchor === cell) {
        hidePopup(); return;
      }
      if (stateNum === 3) {
        showPopup(buildLookupPicker(BRANCHES[idx].region), cell, {width:480, maxWidth:520});
      } else {
        showPopup(buildCellTooltip(idx), cell, {width:260});
      }
    });
  });

  // Delete buttons in source view → show modal
  document.querySelectorAll('.btn-del-src').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const name = btn.dataset.name;
      const deps = BRANCHES.filter(b => b.region === name).length;
      if (deps > 0) {
        showDeleteModal(name, deps);
      }
    });
  });
}

function showDeleteModal(name, depCount) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-icon">${ico('block',20)}</div>
        <div>
          <div class="modal-title">Невозможно удалить «${name}»</div>
          <div class="modal-sub">Значение используется в справочниках-приёмниках</div>

      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-m);margin-bottom:8px">Следующие справочники ссылаются на эту запись:</p>
        <div class="modal-dep-list">

            ${ico('doc',14)} <span>Филиалы</span>
            <span style="font-size:12px;color:var(--text-f);margin-left:4px">· Главный офис</span>
            <span class="modal-dep-count">${depCount} ${depCount===1?'запись':'записи'}</span>
          </div>
        </div>
        <p style="font-size:12px;color:var(--text-f);margin-top:12px;display:flex;align-items:flex-start;gap:5px">
          ${ico('info',13)} Чтобы удалить: сначала удалите связь или замените значения в приёмниках.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Закрыть</button>
        <button class="btn">${ico('right',13)} Перейти к Филиалы</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

const RENDERS = [R0,R1,R2,R3,R4,R5,R6,R7,R8,R9];

// ─── THEME TOGGLE ────────────────────────────────────────────
function toggleTheme() {
  document.documentElement.classList.toggle('dark-theme');
  const isDark = document.documentElement.classList.contains('dark-theme');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
(function() {
  // По умолчанию тёмная тема
  const saved = localStorage.getItem('theme');
  if (saved === 'light') {
    // пользователь сохранил светлую — оставляем
  } else {
    document.documentElement.classList.add('dark-theme');
    // Если не было сохранённой темы, запоминаем тёмную как дефолт
    if (!saved) localStorage.setItem('theme', 'dark');
  }
})();

// ─── STATE MACHINE ───────────────────────────────────────────
let currentState = 0;

function setState(n) {
  currentState = n;
  hidePopup();
  document.querySelectorAll('.sb-btn').forEach((b,i) => b.classList.toggle('active', i===n));
  document.getElementById('contentArea').innerHTML = RENDERS[n]();
  attachInteractions(n);

  // Auto-open popup for demonstration states
  setTimeout(() => {
    const th = document.querySelector('.th-lookup');
    const cells = document.querySelectorAll('.lookup-cell');
    if (n===1 && th)      showPopup(buildHeaderTooltip(), th, {width:260});
    if (n===2 && cells[1])showPopup(buildCellTooltip(1), cells[1], {width:260});
    if (n===3 && cells[1])showPopup(buildLookupPicker(BRANCHES[1].region), cells[1], {width:480, maxWidth:520});
    if (n===4 && th)      showPopup(buildSpravPicker(1), th, {width:300});
    if (n===5 && th)      showPopup(buildSpravPicker(2), th, {width:300});
  }, 60);
}

setState(0);
</script>
